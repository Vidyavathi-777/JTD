<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JTD Admin — Donor Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --coral: #e8745c;
      --coral-hover: #d6634d;
      --blue: #3b719f;
      --dark: #212529;
      --muted: #6c757d;
      --light: #f8f9fa;
      --border: #dee2e6;
      --white: #ffffff;
      --radius: 8px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
    }

    .page-wrapper {
      margin: 0 auto;
      padding: 0px 24px 0px 24px;
      background-color: var(--light);
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: var(--white);
      border-bottom: 1px solid #e5e5e5;
      margin-bottom: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--dark);
    }

    .logo img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
    }

    .logo-text {
      font-family: "Montserrat", sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #d6634d;
    }

    .logo-text span {
      color: var(--blue);
      font-size: 16px;
      font-weight: 600;
      margin-left: 6px;
    }

    .admin-badge {
      background: #fff1e6;
      color: #d6634d;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }

    /* ── Stats Grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #fff1e6;
      padding: 20px 20px 20px 24px;
      border-radius: 16px;
      border: 1px solid rgba(214, 99, 77, 0.15);
    }

    .stat-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--coral-hover);
      line-height: 1.2;
    }

    .stat-value.small {
      font-size: 15px;
      color: var(--coral);
      margin-top: 4px;
    }

    /* ── Table Card ── */
    .table-card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 40px;
    }

    .table-header {
      padding: 22px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--white);
    }

    .table-title {
      font-family: "Montserrat", sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--dark);
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: var(--light);
      padding: 14px 24px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 15px 24px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #fef9f7;
    }

    /* ── Pagination ── */
    .pagination {
      padding: 20px 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      background: var(--white);
      border-top: 1px solid var(--border);
    }

    .page-info {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }

    /* ── Buttons ── */
    .btn {
      padding: 10px 20px;
      background: var(--coral);
      color: var(--white);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: "Inter", sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--coral-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(232, 116, 92, 0.25);
    }

    .btn:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-outline {
      background: transparent;
      color: var(--coral);
      border: 1px solid var(--coral);
    }

    .btn-outline:hover {
      background: #fff1e6;
      transform: translateY(-1px);
      box-shadow: none;
    }

    .btn-outline:disabled {
      background: transparent;
      color: var(--border);
      border-color: var(--border);
    }

    /* ── Loading / Error ── */
    .loading {
      text-align: center;
      padding: 50px 40px;
      color: var(--muted);
      font-weight: 500;
      font-size: 15px;
    }

    .loading::before {
      content: "";
      display: block;
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--coral);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-msg {
      color: #d93025;
      padding: 16px 24px;
      background: #fff5f5;
      border-radius: var(--radius);
      margin: 20px 24px;
      font-weight: 500;
      font-size: 14px;
      border-left: 4px solid #d93025;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        text-align: center;
        gap: 15px;
        padding: 20px 24px;
      }

      .table-header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <header>
      <a href="/admin.html" class="logo">
        <img src="/image.png" alt="Joining The Dots Logo" />
        <div class="logo-text">Joining The Dots <span>Admin</span></div>
      </a>
      <div class="admin-badge">Admin Dashboard</div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Donors</div>
        <div class="stat-value" id="totalCount">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Data Status</div>
        <div class="stat-value small">Live Integration</div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <div class="table-title">Customer Directory</div>
        <button class="btn btn-outline" onclick="refresh()">Refresh</button>
      </div>
      <div class="table-wrapper">
        <div id="loading" class="loading">Loading donors</div>
        <div id="error" class="error-msg" style="display: none;"></div>
        <table id="customerTable" style="display: none;">
          <thead>
            <tr>
              <th>Donor Name</th>
              <th>Email &amp; Phone</th>
              <th>PAN Details</th>
              <th>Joined On</th>
            </tr>
          </thead>
          <tbody id="customerBody"></tbody>
        </table>
      </div>
      <div class="pagination">
        <button id="prevBtn" class="btn btn-outline" onclick="changePage(-1)" disabled>Previous</button>
        <span class="page-info" id="pageInfo">Page 1</span>
        <button id="nextBtn" class="btn btn-outline" onclick="changePage(1)">Next</button>
      </div>
    </div>
  </div>

  <script>
    let currentPage = 0;
    const pageSize = 15;

    async function fetchCustomers(skip = 0) {
      const loading = document.getElementById('loading');
      const table = document.getElementById('customerTable');
      const error = document.getElementById('error');

      loading.style.display = 'block';
      table.style.display = 'none';
      error.style.display = 'none';

      try {
        const res = await fetch(`/api/admin/customers?count=${pageSize}&skip=${skip}`);
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Connection failed');

        renderCustomers(data.items);
        document.getElementById('totalCount').textContent = data.count;
        document.getElementById('pageInfo').textContent = `Page ${currentPage + 1}`;
        document.getElementById('prevBtn').disabled = (currentPage === 0);
        document.getElementById('nextBtn').disabled = (data.items.length < pageSize);

        loading.style.display = 'none';
        table.style.display = 'table';
      } catch (err) {
        loading.style.display = 'none';
        error.textContent = err.message;
        error.style.display = 'block';
      }
    }

    function renderCustomers(customers) {
      const body = document.getElementById('customerBody');
      body.innerHTML = '';

      customers.forEach(c => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td style="font-weight: 700; color: var(--dark);">${c.name || '<span style="color:var(--muted); font-weight:400;">No Name</span>'}</td>
          <td>
            <div style="font-weight: 500;">${c.email || '—'}</div>
            <div style="font-size: 12px; color: var(--muted); margin-top: 2px;">${c.contact || 'No contact'}</div>
          </td>
          <td style="color: var(--dark);">${c.pan || '<span style="color:var(--muted);">Not Provided</span>'}</td>
          <td style="color: var(--muted); font-size: 13px;">${new Date(c.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })}</td>
        `;
        body.appendChild(row);
      });
    }

    function changePage(delta) {
      currentPage += delta;
      fetchCustomers(currentPage * pageSize);
    }

    function refresh() {
      currentPage = 0;
      fetchCustomers(0);
    }

    window.onload = () => fetchCustomers(0);
  </script>
</body>

</html>
